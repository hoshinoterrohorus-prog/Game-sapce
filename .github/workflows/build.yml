name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak project dari zip
        run: |
          Z=$(ls *Prism*.zip | head -n1)
          echo "Zip: $Z"
          mkdir -p work && unzip -q "$Z" -d work
          P=$(dirname "$(find work -name settings.gradle.kts | head -n1)")
          echo "Project: $P"
          echo "PROJ=$P" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        run: |
          cd "$PROJ"
          gradle :app:assembleDebug --no-daemon --stacktrace
          ls -la app/build/outputs/apk/debug

      - uses: actions/upload-artifact@v4
        with:
          name: PrismLauncher.apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
